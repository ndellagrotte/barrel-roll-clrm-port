plugins {
    id 'java'
    id 'com.cleanroommc.cleanroomgradle'
    id 'com.cleanroommc.conventions' version '1.4.4'
}

group = root_package

base {
    archivesName = mod_id
}

def accessTransformerNames = access_transformers.tokenize()
def mixinConfigs = mixin_configs.tokenize(',')*.trim().findAll { !it.isEmpty() }.join(',')

conventions {
    if (mod_authors) {
        author = mod_authors
    }
    mods {
        if (curseforge_project_id) {
            curseforge {
                projectId = curseforge_project_id
            }
        }
        if (modrinth_project_id) {
            modrinth {
                projectId = modrinth_project_id
            }
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name 'CurseMaven'
                url 'https://curse.cleanroommc.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    implementation cleanroom.userdev(cleanroom_version) {
        accessTransformers.from(accessTransformerNames.collect { "src/main/resources/META-INF/$it" })
    }
}

cleanroom {
    runs {
        client {
            configure {
                username = minecraft_username
                jvmArgs extra_jvm_args.tokenize()
                if (mixinConfigs) {
                    // Cleanroom reads this in dev to register mixin configs that would otherwise come from the jar manifest
                    jvmArgs "-Dcrl.dev.mixin=${mixinConfigs}"
                }
            }
        }
        server {
            configure {
                jvmArgs extra_jvm_args.tokenize()
                if (mixinConfigs) {
                    jvmArgs "-Dcrl.dev.mixin=${mixinConfigs}"
                }
            }
        }
    }
}

tokenEnvoy {
    set 'MOD_VERSION', project.version
    set 'MOD_AUTHORS', mod_authors.tokenize(',')*.trim().join('", "')
    set file('tokens.properties')
}

jar {
    manifest {
        // Conventions fills Implementation-/Specification-Vendor with CleanroomMC, override with the mod authors
        attributes 'Implementation-Vendor': mod_authors, 'Specification-Vendor': mod_authors
        attributes 'ModType': 'CRL'
        if (mixinConfigs) {
            attributes 'MixinConfigs': mixinConfigs
        }
        if (accessTransformerNames) {
            attributes 'FMLAT': accessTransformerNames.join(' ')
        }
        if (coremod_plugin_class) {
            attributes 'FMLCorePlugin': coremod_plugin_class
            if (coremod_includes_mod.toBoolean()) {
                attributes 'FMLCorePluginContainsFMLMod': true, 'ForceLoadAsMod': true
            }
        }
    }
}

tasks.withType(Checkstyle).configureEach {
    enabled = enable_checkstyle.toBoolean()
}

tasks.matching { it.name in ['clearSkiesCheck', 'formatJavaCheck'] }.configureEach {
    enabled = enable_formatting.toBoolean()
}

// TODO: fundamental Foundation issue (carried over from CleanroomModTemplate)
tasks.withType(JavaExec).configureEach {
    systemProperty 'foundation.loadsall', 'true'
}
